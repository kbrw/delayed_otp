name: Test

on:
  - push
  - workflow_dispatch

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    name: Test on OTP ${{ matrix.otp }} / Elixir ${{ matrix.elixir }}
    strategy:
      matrix:
        include:
          - {elixir: "1.12.3", otp: "24"}
          - {elixir: "1.13.4", otp: "25"}
          - {elixir: "1.14.5", otp: "26"}
          - {elixir: "1.15.8", otp: "26"}
          - {elixir: "1.16.3", otp: "26"}
          - {elixir: "1.17.3", otp: "27"}
          - {elixir: "1.18.4", otp: "27"}
          - {elixir: "1.19.6", otp: "28"}
          - {elixir: "1.20.4", otp: "27"}
          - {elixir: "1.20.4", otp: "28"}
          - {elixir: "1.20.4", otp: "29"}
    steps:
    - name: Set up Elixir
      uses: erlef/setup-beam@v1
      with:
        otp-version: ${{matrix.otp}}
        elixir-version: ${{matrix.elixir}}

    - name: Checkout code
      uses: actions/checkout@v5

    - name: Cache deps
      id: cache-deps
      uses: actions/cache@v5
      with:
        path: deps
        key: ${{ runner.os }}-mix-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('**/mix.lock') }}
        restore-keys: |
          ${{ runner.os }}-mix-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-

    - name: Cache compiled build
      id: cache-build
      uses: actions/cache@v5
      with:
        path: _build
        key: ${{ runner.os }}-build-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ env.MIX_ENV }}-${{ hashFiles('**/mix.lock') }}
        restore-keys: |
          ${{ runner.os }}-build-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ env.MIX_ENV }}-

    - name: Compile dependencies
      if: steps.cache-deps.outputs.cache-hit != 'true' || github.run_attempt != '1'
      run: |
        mix deps.get --check-locked
        mix deps.unlock --check-unused
        mix hex.audit

    - name: Compile
      run: mix compile

    - name: Run tests
      run: mix test
